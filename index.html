<script>
/* =====================================================================
   ModaB2B AI — App offline de un solo archivo.
   Toda la "IA" es heurística/algorítmica local (k-means, pronóstico por
   velocidad × factor de tendencia, análisis de píxeles en canvas).
   Los puntos marcados con  [API IA]  indican dónde se podría conectar
   un servicio real de IA más adelante.
   ===================================================================== */
'use strict';
const TC = 6.96;                       // 1 USD = 6,96 Bs
const SIZES = ['XS','S','M','L','XL','XXL'];
const REG = ['Santa Cruz','La Paz','Cochabamba'];
const KEY = 'modab2b_ai_v1';
const DEAD_WEEKS = 16;                 // semanas de cobertura a partir de las cuales el stock se considera inmovilizado
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (n, d=0) => Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = n => 'US$ ' + fmtN(n, 0);
const bs = n => 'Bs ' + fmtN(n*TC, 0);
const money = n => `${usd(n)} <span class="muted small">(${bs(n)})</span>`;
const sum = a => a.reduce((x,y)=>x+y,0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ---------------------------- DATOS DEMO ---------------------------- */
function demoData(){
  const r = rng(20261002);
  const prov = [

    {id:'T9',nombre:'Alpaca y fibras andinas',tipo:'Tela',hex:'#A47551',redes:84,pasarela:88,mom:+10},
    {id:'T10',nombre:'Satén brillante',tipo:'Tela',hex:'#C9B6E4',redes:55,pasarela:61,mom:-3},

  ];
  const base = [
    ['Blazer oversize lana fría','Sastrería','Otoño-Invierno 26','P2','T5',62,149],
    ['Saco alpaca tejido','Tejidos','Andina Lux','P3','T9',48,129],
    ['Pantalón palazzo lino','Pantalones','Primavera-Verano 26','P1','T6',28,74],
    ['Camisa lino lavado','Camisas','Primavera-Verano 26','P1','T8',22,59],
    ['Vestido satén midi','Vestidos','Gala 26','P4','T10',35,98],
    ['Vestido lentejuelas noche','Vestidos','Gala 26','P4','T12',41,119],
    ['Jean slim tiro alto','Pantalones','Básicos','P4','T7',18,49],
    ['Chaqueta estructurada oliva','Chaquetas','Otoño-Invierno 26','P2','T1',55,139],
    ['Poncho alpaca terracota','Tejidos','Andina Lux','P3','T2',52,138],
    ['Top punto mantequilla','Tejidos','Primavera-Verano 26','P1','T3',15,42],
    ['Abrigo largo negro','Chaquetas','Otoño-Invierno 26','P2','T4',78,189],
    ['Falda plisada satén','Faldas','Gala 26','P4','T10',24,64],
    ['Traje sastre terracota','Sastrería','Otoño-Invierno 26','P2','T2',85,219],
    ['Chaleco alpaca oliva','Tejidos','Andina Lux','P3','T1',33,89],
    ['Camisa slim popelina','Camisas','Básicos','P1','T7',14,38],
    ['Pantalón sastre negro','Pantalones','Básicos','P1','T4',26,69]
  ];
  // Curvas de talla típicas (participación de ventas por talla)
  const curves = {normal:[.06,.2,.32,.24,.13,.05], chica:[.14,.3,.3,.16,.08,.02], grande:[.03,.12,.25,.3,.2,.1]};
  const skus = base.map((b,i)=>{
    const tr = trends.find(t=>t.id===b[4]);
    const hot = (tr.redes+tr.pasarela)/200;            // 0..1
    const curve = [curves.normal,curves.chica,curves.grande][i%3];
    const regW = [[.5,.25,.25],[.3,.45,.25],[.35,.25,.4]][i%3];

    REG.forEach((rg,ri)=>{

      const over = hot<0.55 ? 3.2 : (r()<0.3?1.8:0.9);
      stock[rg] = SIZES.map((_,si)=>Math.round((v*8*over)*( over>1.5 ? 1/6 : curve[si])*(0.8+r()*0.4)));
    });
    return {id:'SKU-'+String(101+i), nombre:b[0], cat:b[1], col:b[2], prov:b[3], trend:b[4], costo:b[5], precio:b[6], vel, stock};
  });
  const orders = [
    {id:'OC-2026-031',prov:'P3',fecha:'2026-09-18',estado:'recibido',horizonte:10,lineas:[{sku:'SKU-102',q:[2,8,14,12,6,2]},{sku:'SKU-109',q:[2,6,10,8,4,1]}],nota:'Reposición Andina Lux'},
    {id:'OC-2026-034',prov:'P1',fecha:'2026-09-29',estado:'enviado',horizonte:12,lineas:[{sku:'SKU-103',q:[4,14,22,16,8,2]},{sku:'SKU-104',q:[5,16,24,18,9,3]}],nota:'Primavera-Verano'}
  ];
  return {empresa:'Distribuidora Élite Moda',ciudad:'Santa Cruz de la Sierra',prov,trends,skus,orders,clusters:null,seq:35};
}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null} if(!S||!S.skus){S=demoData();save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn('No se pudo guardar',e)}}

/* -------------------------- CÁLCULOS BASE --------------------------- */
const provBy = id => S.prov.find(p=>p.id===id);
const trendBy = id => S.trends.find(t=>t.id===id);
const skuBy = id => S.skus.find(s=>s.id===id);
function trendScore(t){ // puntaje 0-100 ponderado: redes 45%, pasarela 40%, momentum 15%
  return Math.max(0,Math.min(100,Math.round(t.redes*.45+t.pasarela*.40+(50+t.mom*2.5)*.15)));
}
function trendFactor(t){ return t ? 0.6 + trendScore(t)/100*0.8 : 1; } // 0,6 – 1,4
function skuStats(s){
  let st=0,vel=0,dead=0; const reg={};
  REG.forEach(rg=>{
    const sr=sum(s.stock[rg]), vr=sum(s.vel[rg]);
    let dr=0;
    SIZES.forEach((_,i)=>{const cap=s.vel[rg][i]*DEAD_WEEKS; dr+=Math.max(0,s.stock[rg][i]-cap)});
    dr=Math.round(dr); reg[rg]={stock:sr,vel:vr,cover:vr>0?sr/vr:99,dead:dr};
    st+=sr; vel+=vr; dead+=dr;
  });
  return {stock:st,vel,cover:vel>0?st/vel:99,dead,reg,valor:st*s.costo,deadVal:dead*s.costo};
}
function totals(){
  let units=0,val=0,dead=0,deadVal=0,cogsYear=0;
  S.skus.forEach(s=>{const k=skuStats(s);units+=k.stock;val+=k.valor;dead+=k.dead;deadVal+=k.deadVal;cogsYear+=k.vel*52*s.costo});
  return {units,val,dead,deadVal,deadPct:units?dead/units*100:0,rot:val?cogsYear/val:0,ahorro:deadVal*0.35};
}

/* ----------------------------- K-MEANS ------------------------------ */
// k-means real (k-means++ para inicializar, distancia euclídea, iteración hasta converger).
function kmeans(X,k,seed=7){
  const r=rng(seed), n=X.length, d=X[0].length;
  const dist=(a,b)=>{let s=0;for(let i=0;i<d;i++){const q=a[i]-b[i];s+=q*q}return s};
  const C=[X[Math.floor(r()*n)].slice()];
  while(C.length<k){
    const D=X.map(x=>Math.min(...C.map(c=>dist(x,c)))); const tot=sum(D); let t=r()*tot, i=0;
    while(i<n-1&&(t-=D[i])>0)i++; C.push(X[i].slice());
  }
  let lab=new Array(n).fill(-1), it=0;
  for(;it<100;it++){
    let changed=false;
    X.forEach((x,i)=>{let b=0,bd=Infinity;C.forEach((c,j)=>{const q=dist(x,c);if(q<bd){bd=q;b=j}});if(lab[i]!==b){lab[i]=b;changed=true}});
    for(let j=0;j<k;j++){const m=X.filter((_,i)=>lab[i]===j); if(m.length) for(let q=0;q<d;q++) C[j][q]=sum(m.map(x=>x[q]))/m.length;}
    if(!changed)break;
  }
  const inertia=sum(X.map((x,i)=>dist(x,C[lab[i]])));
  return {lab,C,it,inertia};
}
function runClustering(k){
  // Vector de rasgos por SKU: velocidad total (log), cobertura (semanas, tope 40), % deadstock,
  // participación regional de ventas (3), centro de masa de la curva de tallas (0=XS … 5=XXL).
  const raw=S.skus.map(s=>{const k=skuStats(s);
    const sv=SIZES.map((_,i)=>sum(REG.map(rg=>s.vel[rg][i]))); const cm=sum(sv.map((v,i)=>v*i))/(sum(sv)||1);
    return [Math.log1p(k.vel),Math.min(k.cover,40),k.stock?k.dead/k.stock:0,...REG.map(rg=>k.reg[rg].vel/(k.vel||1)),cm]});
  const d=raw[0].length, mu=[],sd=[];
  for(let q=0;q<d;q++){const col=raw.map(x=>x[q]);mu[q]=sum(col)/col.length;sd[q]=Math.sqrt(sum(col.map(v=>(v-mu[q])**2))/col.length)||1}
  const X=raw.map(x=>x.map((v,q)=>(v-mu[q])/sd[q]));
  const res=kmeans(X,k);
  const groups=[];
  for(let j=0;j<k;j++){
    const idx=res.lab.map((l,i)=>l===j?i:-1).filter(i=>i>=0); if(!idx.length)continue;
    const cover=sum(idx.map(i=>raw[i][1]))/idx.length, deadp=sum(idx.map(i=>raw[i][2]))/idx.length, vel=sum(idx.map(i=>Math.expm1(raw[i][0])))/idx.length;
    const cm=sum(idx.map(i=>raw[i][6]))/idx.length; const regS=REG.map((_,q)=>sum(idx.map(i=>raw[i][3+q]))/idx.length);
    const topReg=REG[regS.indexOf(Math.max(...regS))];
    let nombre,tipo;
    if(deadp>0.35||cover>24){nombre='Riesgo de deadstock';tipo='bad'} else if(cover<8){nombre='Alta rotación';tipo='ok'} else {nombre='Rotación media';tipo='warn'}
    const curva = cm<2.1?'curva chica (XS-M)':cm>2.6?'curva grande (L-XXL)':'curva centrada (S-L)';
    groups.push({j,nombre:nombre+' · '+topReg,tipo,skus:idx.map(i=>S.skus[i].id),cover,deadp,vel,curva,topReg});
  }
  groups.sort((a,b)=>b.deadp-a.deadp);
  S.clusters={k,fecha:new Date().toISOString(),it:res.it,inertia:res.inertia,groups,acciones:suggestActions()};
  save(); return S.clusters;
}
function suggestActions(){
  // Heurística: si una talla está sobrestockeada en una región y faltante en otra → transferencia.
  // Si sobra en todas → rebaja (markdown) escalonada según cobertura.
  const acts=[];
  S.skus.forEach(s=>{
    SIZES.forEach((sz,i)=>{
      const cov=REG.map(rg=>s.vel[rg][i]>0?s.stock[rg][i]/s.vel[rg][i]:99);
      const src=cov.indexOf(Math.max(...cov)), dst=cov.indexOf(Math.min(...cov));
      if(cov[src]>DEAD_WEEKS&&cov[dst]<6){
        const excess=Math.floor(s.stock[REG[src]][i]-s.vel[REG[src]][i]*10), need=Math.ceil(s.vel[REG[dst]][i]*8-s.stock[REG[dst]][i]);
        const q=Math.min(excess,need); if(q>=2) acts.push({tipo:'Transferencia',sku:s.id,talla:sz,de:REG[src],a:REG[dst],q,valor:q*s.precio});
      }
    });
    const k=skuStats(s);
    if(k.dead>0&&k.cover>DEAD_WEEKS){const pct=k.cover>40?30:k.cover>25?20:15;acts.push({tipo:'Rebaja',sku:s.id,pct,q:k.dead,valor:k.dead*s.precio*(1-pct/100)})}
  });
  return acts.sort((a,b)=>b.valor-a.valor);
}

/* --------------------- PEDIDO MAYORISTA INTELIGENTE ------------------ */
// Pronóstico = velocidad semanal × factor de tendencia × (lead time + horizonte) − stock disponible + stock de seguridad.
// [API IA] Aquí se podría reemplazar el pronóstico por un modelo de series de tiempo o un LLM con señales reales.
function recommend(s,horizon){
  const t=trendBy(s.trend), f=trendFactor(t), p=provBy(s.prov), weeks=horizon+(p?p.lead/7:0);
  const rec=[], naive=[], dem=[];
  const totNaiveBase = sum(REG.map(rg=>sum(s.vel[rg])))*weeks*1.25; // pedido "a ojo": +25% y curva plana
  SIZES.forEach((_,i)=>{
    const v=sum(REG.map(rg=>s.vel[rg][i])), st=sum(REG.map(rg=>s.stock[rg][i]));
    const d=v*f*weeks; dem.push(d);
    const safety=Math.sqrt(Math.max(d,0))*1.0;            // stock de seguridad ~ 1σ (Poisson)
    rec.push(Math.max(0,Math.ceil(d+safety-st)));
    naive.push(Math.max(0,Math.round(totNaiveBase/6-st/2)));
  });
  return {rec,naive,dem,f,weeks};
}
function deadAvoided(s,r){ // unidades del pedido ingenuo que superan la demanda pronosticada
  let u=0,ur=0; SIZES.forEach((_,i)=>{const st=sum(REG.map(rg=>s.stock[rg][i]));u+=Math.max(0,r.naive[i]+st-r.dem[i]*1.15);ur+=Math.max(0,r.rec[i]+st-r.dem[i]*1.15)});
  return Math.max(0,Math.round(u-ur));
}

function analyzeCanvas(cv){
  // [API IA] Aquí se podría enviar la imagen a un modelo de visión (clasificación de prenda, tela, corte).
  const ctx=cv.getContext('2d'),{data}=ctx.getImageData(0,0,cv.width,cv.height);
  const bins={};let lum=0,sat=0,n=0;
  for(let i=0;i<data.length;i+=16){const r=data[i],g=data[i+1],b=data[i+2];if(data[i+3]<128)continue;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);lum+=(mx+mn)/510;sat+=mx?(mx-mn)/mx:0;n++;
    const k=(r>>5)+','+(g>>5)+','+(b>>5);(bins[k]=bins[k]||{c:0,r:0,g:0,b:0});bins[k].c++;bins[k].r+=r;bins[k].g+=g;bins[k].b+=b}
  const top=Object.values(bins).sort((a,b)=>b.c-a.c).slice(0,5).map(x=>({r:x.r/x.c|0,g:x.g/x.c|0,b:x.b/x.c|0,p:x.c/n}));
  const hex=c=>'#'+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,'0')).join('');
  const toRgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const colorT=S.trends.filter(t=>t.tipo==='Color');
  const matches=top.slice(0,3).map(c=>{let best=null,bd=1e9;colorT.forEach(t=>{const [r,g,b]=toRgb(t.hex);const d=Math.hypot(r-c.r,g-c.g,b-c.b);if(d<bd){bd=d;best=t}});return {c,t:best,sim:Math.max(0,100-bd/4.4)}});
  lum/=n;sat/=n;
  photoRes=`<div class="grid g2" style="margin-top:12px"><div><b>Colores dominantes</b><div class="row" style="margin-top:6px">${top.map(c=>`<div style="text-align:center"><div class="sw" style="width:44px;height:44px;background:${hex(c)}"></div><div class="small">${fmtN(c.p*100)}%</div></div>`).join('')}</div>
   <p class="small">Luminosidad: <b>${lum>.6?'clara':lum<.35?'oscura':'media'}</b> · Saturación: <b>${sat>.45?'vibrante':sat<.2?'neutra':'moderada'}</b> · Temporada sugerida: <b>${lum<.4?'Otoño-Invierno':'Primavera-Verano'}</b></p></div>
   <div><b>Coincidencia con el radar</b>${matches.map(m=>`<div class="trend" style="grid-template-columns:auto 1fr auto"><div class="sw" style="background:${m.t.hex}"></div><div>${esc(m.t.nombre)}<div class="small muted">Similitud de color ${fmtN(m.sim)}%</div></div><div class="score">${trendScore(m.t)}</div></div>`).join('')}
   <p class="note">Análisis heurístico de píxeles; no identifica tipo de prenda ni tela.</p></div></div>`;
  const o=$('#photoOut'); if(o)o.innerHTML=photoRes;
}

  return head('Pedido mayorista inteligente','Cantidades por talla según pronóstico de demanda, tendencia y curva de tallas')+
  `<div class="card"><div class="row">
   <label class="f">Proveedor<select id="pProv">${S.prov.map(x=>`<option value="${x.id}" ${x.id===draft.prov?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label>
   <label class="f">Horizonte de venta (semanas)<input id="pHor" type="number" min="2" max="40" value="${draft.horizonte}" style="width:110px"></label>
   ${p?`<span class="small muted" style="align-self:flex-end">Lead time ${p.lead} días · MOQ ${p.moq} uds · confiabilidad ${p.conf}%</span>`:''}</div></div>
  <div class="grid k4" style="margin-top:14px">
   <div class="card kpi a"><div class="lbl">Pedido recomendado</div><div class="val">${fmtN(recU)} uds.</div><div class="sub">${money(recV)}</div></div>
   <div class="card kpi"><div class="lbl">Pedido ingenuo (curva plana +25%)</div><div class="val">${fmtN(naiveU)} uds.</div><div class="sub">${money(naiveV)}</div></div>
   <div class="card kpi s"><div class="lbl">Deadstock evitado</div><div class="val">${fmtN(avoided)} uds.</div><div class="sub">${money(avoidedV)}</div></div>
   <div class="card kpi w"><div class="lbl">Capital liberado</div><div class="val">${usd(Math.max(0,naiveV-recV))}</div><div class="sub">${bs(Math.max(0,naiveV-recV))}</div></div></div>
  ${moqOk?'':`<div class="alert bad" style="margin-top:12px">El pedido recomendado (${recU} uds.) no alcanza el MOQ de ${p.moq} uds. Amplíe el horizonte o combine con otro proveedor.</div>`}
  <div class="card" style="margin-top:14px"><h3>Detalle por SKU y talla</h3><div class="tw"><table><tr><th>SKU</th><th class="num">Factor tend.</th><th>Talla</th>${SIZES.map(z=>`<th class="num">${z}</th>`).join('')}<th class="num">Total</th></tr>
   ${lines.map(l=>`<tr><td rowspan="2"><b>${esc(l.s.nombre)}</b><div class="small muted">${l.s.id} · ${usd(l.s.costo)} c/u</div></td><td rowspan="2" class="num">×${fmtN(l.r.f,2)}</td><td class="small"><b>IA</b></td>${l.r.rec.map(q=>`<td class="num"><b>${q}</b></td>`).join('')}<td class="num"><b>${sum(l.r.rec)}</b></td></tr>
    <tr><td class="small muted">Ingenuo</td>${l.r.naive.map(q=>`<td class="num muted">${q}</td>`).join('')}<td class="num muted">${sum(l.r.naive)}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">Este proveedor no tiene SKU.</td></tr>'}</table></div>
   <div class="row" style="margin-top:12px"><button class="btn" data-act="saveOrder" ${lines.length?'':'disabled'}>💾 Guardar como borrador</button></div>
   <p class="note">Recomendado = venta semanal × factor de tendencia × (horizonte + lead time) + stock de seguridad (√demanda) − stock actual, por talla. Ingenuo = venta histórica +25% repartida en partes iguales entre tallas.</p></div>
  <div class="card" style="margin-top:14px"><h3>Órdenes de compra</h3><div class="tw"><table><tr><th>N.º</th><th>Proveedor</th><th>Fecha</th><th class="num">Unidades</th><th class="num">Monto</th><th>Estado</th><th>Acciones</th></tr>
   ${S.orders.slice().reverse().map(o=>{const u=sum(o.lineas.map(l=>sum(l.q))),v=sum(o.lineas.map(l=>sum(l.q)*(skuBy(l.sku)?.costo||0)));return `<tr><td><b>${o.id}</b></td><td class="small">${esc(provBy(o.prov)?.nombre||o.prov)}</td><td class="small">${o.fecha}</td><td class="num">${fmtN(u)}</td><td class="num">${money(v)}</td>
    <td><select data-state="${o.id}">${['borrador','enviado','recibido'].map(e=>`<option ${o.estado===e?'selected':''}>${e}</option>`).join('')}</select></td>
    <td class="row" style="gap:4px"><button class="btn ghost sm" data-print="${o.id}">🖨 Imprimir</button><button class="btn ghost sm" data-csv="${o.id}">CSV</button><button class="btn ghost sm" data-del="${o.id}">✕</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Sin órdenes.</td></tr>'}</table></div>
   <p class="note">"Enviado" solo cambia el estado aquí; la app no envía nada al proveedor. "Recibido" suma las unidades al stock de Santa Cruz.</p></div>`;
}
function saveOrder(){
  const lines=S.skus.filter(s=>s.prov===draft.prov).map(s=>({sku:s.id,q:recommend(s,+draft.horizonte).rec})).filter(l=>sum(l.q)>0);
  if(!lines.length){toast('No hay cantidades para pedir');return}
  S.seq=(S.seq||0)+1; const o={id:'OC-2026-'+String(S.seq).padStart(3,'0'),prov:draft.prov,fecha:localDate(),estado:'borrador',horizonte:+draft.horizonte,lineas:lines};
  S.orders.push(o); save(); render(); toast('Orden '+o.id+' guardada como borrador');
}
function setState(id,st){const o=S.orders.find(x=>x.id===id);if(!o)return;if(st==='recibido'&&o.estado!=='recibido'){o.lineas.forEach(l=>{const s=skuBy(l.sku);if(s)l.q.forEach((q,i)=>s.stock['Santa Cruz'][i]+=q)})}o.estado=st;save();render();toast(`${id}: ${st}`)}
function orderHTML(o){const p=provBy(o.prov);let tot=0;const rows=o.lineas.map(l=>{const s=skuBy(l.sku)||{nombre:l.sku,costo:0};const u=sum(l.q);tot+=u*s.costo;return `<tr><td>${l.sku}</td><td>${esc(s.nombre)}</td>${l.q.map(q=>`<td class="num">${q}</td>`).join('')}<td class="num">${u}</td><td class="num">${usd(u*s.costo)}</td></tr>`}).join('');
  return `<h2>${esc(S.empresa)} — Orden de compra ${o.id}</h2><p>${esc(S.ciudad)} · Fecha: ${o.fecha} · Estado: ${o.estado}<br>Proveedor: <b>${esc(p?.nombre||o.prov)}</b> · ${esc(p?.contacto||'')}</p>
  <table border="1" cellspacing="0" cellpadding="4"><tr><th>SKU</th><th>Prenda</th>${SIZES.map(z=>`<th>${z}</th>`).join('')}<th>Total</th><th>Monto</th></tr>${rows}</table><p><b>Total: ${usd(tot)} (${bs(tot)})</b> · Tipo de cambio 1 USD = 6,96 Bs</p>`}
function printOrder(id){const o=S.orders.find(x=>x.id===id);$('#printArea').innerHTML=orderHTML(o);window.print()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvOrder(id){const o=S.orders.find(x=>x.id===id);const rows=[['Orden','Proveedor','SKU','Prenda',...SIZES,'Total','Costo USD','Monto USD','Monto Bs']];
  o.lineas.forEach(l=>{const s=skuBy(l.sku)||{nombre:'',costo:0};const u=sum(l.q);rows.push([o.id,provBy(o.prov)?.nombre||o.prov,l.sku,s.nombre,...l.q,u,s.costo,u*s.costo,(u*s.costo*TC).toFixed(2)])});
  download(o.id+'.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');toast('CSV exportado')}

function proveedores(){
  return head('Proveedores','Lead time, pedido mínimo (MOQ) y confiabilidad de entrega')+
  `<div class="grid g2">${S.prov.map(p=>{const n=S.skus.filter(s=>s.prov===p.id).length;return `<div class="card"><h3>${esc(p.nombre)}</h3><div class="small muted">${esc(p.pais)} · ${esc(p.contacto)} · ${n} SKU</div>
   <div class="grid g3" style="margin-top:10px"><div><div class="small muted">Lead time</div><b>${p.lead} días</b></div><div><div class="small muted">MOQ</div><b>${p.moq} uds.</b></div><div><div class="small muted">Confiabilidad</div><b>${p.conf}%</b></div></div>
   <div class="bar" style="margin-top:8px"><i style="width:${p.conf}%;background:${p.conf>=90?'var(--success)':p.conf>=80?'var(--warning)':'var(--danger)'}"></i></div>
   <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-orderprov="${p.id}">Crear pedido</button><button class="btn ghost sm" data-delprov="${p.id}">Eliminar</button></div></div>`}).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>Agregar proveedor</h3><form id="provForm" class="row">
   <label class="f">Nombre<input name="nombre" required></label><label class="f">País<input name="pais" value="Bolivia"></label><label class="f">Contacto<input name="contacto"></label>
   <label class="f">Lead time (días)<input name="lead" type="number" min="1" value="21" style="width:90px"></label><label class="f">MOQ<input name="moq" type="number" min="1" value="100" style="width:90px"></label><label class="f">Confiabilidad %<input name="conf" type="number" min="0" max="100" value="85" style="width:90px"></label>
   <button class="btn">Agregar</button></form></div>`;
}
function ajustes(){
  return head('Ajustes','Datos, respaldo y supuestos')+
  `<div class="grid g2"><div class="card"><h3>Empresa</h3><form id="empForm" class="row"><label class="f">Nombre<input name="empresa" value="${esc(S.empresa)}"></label><label class="f">Ciudad<input name="ciudad" value="${esc(S.ciudad)}"></label><button class="btn">Guardar</button></form></div>
  <div class="card"><h3>Datos</h3><div class="row"><button class="btn" data-act="demo">Cargar datos demo (Distribuidora Élite Moda)</button><button class="btn bad" data-act="zero">Empezar de cero</button></div>
   <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="export">⬇ Exportar JSON</button><button class="btn ghost" data-act="import">⬆ Importar JSON</button></div></div>
  <div class="card"><h3>Supuestos</h3><ul class="small"><li>Tipo de cambio: 1 USD = 6,96 Bs.</li><li>Stock inmovilizado: unidades por encima de ${DEAD_WEEKS} semanas de venta (por talla y región).</li><li>Ahorro proyectado: 35% del valor inmovilizado (meta del informe estratégico).</li><li>Puntaje de tendencia: 45% redes + 40% pasarela + 15% momentum (señales simuladas).</li></ul></div>
  <div class="card"><h3>Acerca de</h3><p class="small">ModaB2B AI · prototipo offline. Toda la "IA" son heurísticas y algoritmos locales (k-means, pronóstico, análisis de color). No se monitorean redes sociales reales ni se envían datos a internet.</p></div></div>`;
}

/* --------------------------- EVENTOS -------------------------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-cat],[data-print],[data-csv],[data-del],[data-orderprov],[data-delprov]'); if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.cat){invFilter=t.dataset.cat;return render()}
  if(t.dataset.print)return printOrder(t.dataset.print);
  if(t.dataset.csv)return csvOrder(t.dataset.csv);
  if(t.dataset.del){if(confirm('¿Eliminar la orden '+t.dataset.del+'?')){S.orders=S.orders.filter(o=>o.id!==t.dataset.del);save();render()}return}
  if(t.dataset.orderprov){draft={prov:t.dataset.orderprov,horizonte:10};return go('pedido')}
  if(t.dataset.delprov){if(S.skus.some(s=>s.prov===t.dataset.delprov))return toast('Tiene SKU asociados; no se puede eliminar');S.prov=S.prov.filter(p=>p.id!==t.dataset.delprov);save();return render()}
  const a=t.dataset.act;
  if(a==='sim')simSignals();
  if(a==='photoDemo')photoDemo();
  if(a==='cluster'){runClustering(+($('#kSel')?.value||4));render();toast('Clustering ejecutado')}
  if(a==='saveOrder')saveOrder();
  if(a==='demo'&&confirm('¿Reemplazar los datos actuales por los datos demo?')){S=demoData();save();draft=null;render();toast('Datos demo cargados')}
  if(a==='zero'&&confirm('¿Borrar todo y empezar de cero?')){S={empresa:'Mi distribuidora',ciudad:'Santa Cruz de la Sierra',prov:[],trends:demoData().trends,skus:[],orders:[],clusters:null,seq:0};save();draft=null;render();toast('Datos borrados')}
  if(a==='export')download('modab2b-respaldo-'+localDate()+'.json',JSON.stringify(S,null,1),'application/json');
  if(a==='import')$('#importFile').click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pProv'){draft.prov=t.value;render()}
  if(t.id==='pHor'){draft.horizonte=Math.max(2,Math.min(40,+t.value||10));render()}
  if(t.dataset.state)setState(t.dataset.state,t.value);
  if(t.id==='photo'&&t.files[0])photoFromFile(t.files[0]);
  if(t.id==='importFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.skus)||!Array.isArray(d.prov))throw 0;S=d;save();draft=null;render();toast('Datos importados')}catch(x){toast('Archivo JSON no válido')}t.value=''};fr.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
  if(e.target.id==='skuForm'){const cv=[.06,.2,.32,.24,.13,.05];const stock={},vel={};REG.forEach(rg=>{stock[rg]=cv.map(c=>Math.round(+f.st*c));vel[rg]=cv.map(c=>+(+f.v*c).toFixed(2))});
    let n=101;while(S.skus.some(s=>s.id==='SKU-'+n))n++;S.skus.push({id:'SKU-'+n,nombre:f.nombre,cat:f.cat,col:f.col,prov:f.prov,trend:f.trend,costo:+f.costo,precio:+f.precio,stock,vel});save();render();toast('SKU agregado')}
  if(e.target.id==='provForm'){let n=1;while(S.prov.some(p=>p.id==='P'+n))n++;S.prov.push({id:'P'+n,nombre:f.nombre,pais:f.pais,contacto:f.contacto,lead:+f.lead,moq:+f.moq,conf:+f.conf});save();render();toast('Proveedor agregado')}
  if(e.target.id==='empForm'){S.empresa=f.empresa;S.ciudad=f.ciudad;save();render();toast('Guardado')}
});

/* ---------------------------- ARRANQUE ------------------------------ */
load();
const h=location.hash.slice(1); if(SECTIONS.some(s=>s[0]===h))cur=h;
render();
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(SECTIONS.some(s=>s[0]===x)&&x!==cur){cur=x;render()}});
</script>
</body>
</html>
